<!DOCTYPE html>
<html>
    <head>
        <title>OSM Web Wizard for V2Sim</title>
        <meta charset="utf-8" />
        <meta name="referrer" content="strict-origin-when-cross-origin" />
        <link rel="stylesheet" href="style.css" />
        <link rel="shortcut icon" type="image/x-icon" href="images/favicon.ico" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
        <script defer src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
        <script type="text/javascript" src="script.js"></script>
    </head>
    <body>
        <div id="map"></div>
        <canvas style="display: none"></canvas>

        <div id="side">
            <div id="tabs">
                <div class="tab" title="Options">
                    <img src="images/generate.png" />
                </div>
                <!--div class="tab" title="Vehicles">
                    <img src="images/passenger.png" />
                </div-->
                <div class="tab" title="Road-Types">
                    <img src="images/road.png" />
                </div>
                <div class="tab" title="Copyright">©</div>
            </div>

            <div class="controls">
                <div class="container">
                    <h4>Position</h4>

                    <div class="options open">
                      <p>
                        <input id="address" value="Beijing" size="18"/>
                        <input id="buttonSearch" type="button" value="Search"/> </br>
                      </p>
                      <p>
                        <input id="lat_lon" value="39.904030 116.407526" size="18"/>
                        <input id="buttonLatLon" type="button" value="Go to"/> </br>
                      </p>
                      <p>
                        <input id="buttonCurrent" type="button" value="Use current location"/></br>
                      </p>
                    </div>
                </div>

                <div class="container">
                    <div class="options open">
                        <label>Select Area <input type="checkbox" id="canvas-toggle" /></label>
                    </div>
                </div>

                <div class="container" style="margin-top: 20px;">
                    <h4>Options</h4>

                    <div class="options open" id="general-options">
                        <label>Duration <input id="duration" type="number" value="172800" min="0" step="1" style="float: none;" /></label>
                        <label>Add Polygons <input id="polygons" type="checkbox" checked /></label>
                        <label class="source-option">OSM data source
                            <select id="osm-source" title="Choose online Overpass or offline local PBF">
                                <option value="overpass" selected>Overpass API (online)</option>
                                <option value="pbf">Local .osm.pbf (offline)</option>
                            </select>
                        </label>
                        <label id="pbf-path-row" class="source-option" hidden>Local PBF file path
                            <input type="text" id="pbf-path" placeholder="D:\OSM\region-latest.osm.pbf" spellcheck="false" autocomplete="off" />
                            <small>The path must exist on the computer running V2Sim. Requires osmium-tool.</small>
                        </label>
                        <label id="partition-option">OSM partition size
                            <select id="tile-size-km" title="Serial Overpass requests, 1 second apart">
                                <option value="2">2 km (dense city)</option>
                                <option value="5" selected>5 km (recommended)</option>
                                <option value="10">10 km (fewer requests)</option>
                                <option value="0">No partition (legacy)</option>
                            </select>
                        </label>
                        <!--label>Import Public Transport <input id="publicTransport" type="checkbox" /></label-->
                        <label>Car-only Network <input id="carOnlyNetwork" type="checkbox" checked /></label>
                        <label>Satellite background <input id="decal" type="checkbox" /></label>
                        <label>Left Hand Traffic <input id="leftHand" type="checkbox" /></label>
                    </div>
                </div>
            </div>

            <!--div class="controls" id="vehicle-controls"></div-->

            <div class="controls" id="road-types"></div>

            <div class="controls">
                <div class="container">
                    <h4>Icon Copyrights</h4>

                    <div class="images">
                        <img src="images/generate.png" />
                        <img src="images/passenger.png" />
                        <img src="images/truck.png" />
                        <img src="images/bicycle.png" />
                    </div>

                    <p>
                        Icons by <a href="http://google.com/design/">Google Design</a>,
                        licensed under <a href="http://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>
                    </p>

                    <div class="images">
                        <img src="images/bus.png" />
                        <img src="images/pedestrian.png" />
                        <img src="images/ship.png" />
                        <img src="images/rail.png" />
                    </div>

                    <p>
                        Icons by <a href="http://aiga.org/">AIGA</a>,
                        Open Domain
                    </p>

                    <div class="images">
                        <img src="images/tram.png" />
                        <img src="images/rail_urban.png" />
                    </div>

                    <p>
                        Icons by <a href="http://www.danilodemarco.com/">Pittogrammi</a>
                    </p>

                    <div class="images">
                        <img src="images/motorcycle.png" />
                    </div>

                    <p>
                        Icon by <a href="http://icons8.com/">Icons8</a>
                    </p>

                    <div class="images">
                        <img src="images/road.png" />
                    </div>

                    <p>
                        Icon by <a href="https://www.flaticon.com/">Flaticon</a>
                    </p>
                </div>
            </div>

            <div id="fixed">
                <button id="export-button">Generate Scenario</button>
                <div id="status" role="status" aria-live="polite">
                    <div class="status-heading">
                        <span id="status-message">Preparing…</span>
                        <strong id="partition-count" hidden>0 / 0</strong>
                    </div>
                    <div id="status-progress-track" class="progress-track" role="progressbar"
                         aria-label="OSM partition download progress" aria-valuemin="0"
                         aria-valuemax="100" aria-valuenow="0">
                        <div id="status-progress-fill" class="progress-fill"></div>
                    </div>
                    <div id="status-detail" class="status-detail">Waiting for task</div>
                </div>
            </div>
        </div>
    </body>
</html>
